# fly.toml app configuration file generated for paperclip-jlabs on 2026-10-24T20:18:03Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'paperclip-jlabs'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  PAPERCLIP_ALLOWED_HOSTNAMES = 'team.jacarendalabs.com'
  PAPERCLIP_AUTH_DISABLE_SIGN_UP = 'false'
  PAPERCLIP_DEPLOYMENT_EXPOSURE = 'public'
  PAPERCLIP_DEPLOYMENT_MODE = 'authenticated'
  PAPERCLIP_PUBLIC_URL = 'https://team.jacarendalabs.com'

[[mounts]]
  source = 'paperclip_data'
  destination = '/paperclip'
  initial_size = '10gb'

[http_service]
  internal_port = 3100
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '1m0s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'performance-2x'
  memory = '8gb'
